[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bili-video2book"
version = "1.7.0"
description = "Batch-transform Bilibili videos & local media into publication-grade deep-dive textbooks and structured review books."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "LINJIANG12"}
]
keywords = ["bilibili", "local-video", "video-to-markdown", "study-notes", "ai-agent", "multimodal-ai", "cheatsheet-generator", "deep-dive-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.scripts]
bili-video2book = "src.cli:main"
bili-skill = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
