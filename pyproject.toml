[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bili-video2book"
version = "2.2.0"
description = "Batch-transform Bilibili videos & local media into publication-grade deep-dive textbooks and structured review books."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "LINJIANG12"}
]
keywords = ["bilibili", "local-video", "video-to-markdown", "study-notes", "ai-agent", "multimodal-ai", "cheatsheet-generator", "deep-dive-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.scripts]
bili-video2book = "src.cli:main"
bili-skill = "src.cli:main"

# 技能自包含于 skills/bili-video2book/：包发现与入口都指向该目录，
# 因此 `pip install -e .` 装到的是技能本体（核心 skill + 工具链），不带仓库级杂物。
[tool.setuptools.packages.find]
where = ["skills/bili-video2book"]
include = ["src*"]
